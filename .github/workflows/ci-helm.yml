name: CI — Helm

on:
  push:
    branches: [main]
    paths:
      - "helm/**"
      - ".github/workflows/ci-helm.yml"
  pull_request:
    branches: [main]
    paths:
      - "helm/**"
      - ".github/workflows/ci-helm.yml"

concurrency:
  group: ci-helm-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CHART_PATH: helm/earmark
  HELM_VERSION: v3.18.4
  KUBECONFORM_VERSION: v0.8.0
  KUBERNETES_VERSION: 1.30.0

jobs:
  helm:
    name: Helm
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install kubeconform
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/bin" kubeconform
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: helm lint
        run: helm lint "$CHART_PATH"

      # ServiceMonitor is a CRD without a bundled schema, hence -ignore-missing-schemas.
      - name: kubeconform (default values)
        run: |
          helm template t "$CHART_PATH" \
            | kubeconform -strict -ignore-missing-schemas -kubernetes-version "$KUBERNETES_VERSION" -summary

      - name: kubeconform (all optional resources enabled)
        run: |
          helm template t "$CHART_PATH" --set serviceMonitor.enabled=true \
            | kubeconform -strict -ignore-missing-schemas -kubernetes-version "$KUBERNETES_VERSION" -summary
