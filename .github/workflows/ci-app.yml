name: CI — App

# Path-filtered: server-only changes do not run this (ci-server.yml has the mirror filter).
# .release-please-manifest.json is the version Gradle reads, so a version bump is built too.

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "api/openapi.yaml"
      - ".release-please-manifest.json"
      - ".github/workflows/ci-app.yml"
      - ".github/workflows/release.yml"
      - "scripts/verify_apk_native_libs.py"
      - "scripts/test_verify_apk_native_libs.py"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "api/openapi.yaml"
      - ".release-please-manifest.json"
      - ".github/workflows/ci-app.yml"
      - ".github/workflows/release.yml"
      - "scripts/verify_apk_native_libs.py"
      - "scripts/test_verify_apk_native_libs.py"

concurrency:
  group: ci-app-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: App
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      # compileSdk 37 is newer than the platforms preinstalled on the runner image.
      - name: Install Android SDK platform and build-tools
        run: |
          SDKMANAGER="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # The tables generate en, nl and es (the generator fails on a missing/orphan Spanish string or different format arguments):
      # a hand edit of strings.xml would be overwritten.
      - name: Strings are in sync with the generator
        run: |
          python3 scripts/test_gen_strings.py
          python3 scripts/gen_strings.py
          git diff --exit-code -- app/src/main/res
          test -z "$(git status --porcelain -- app/src/main/res)"

      - name: Test APK native-library verification
        run: python3 ../scripts/test_verify_apk_native_libs.py

      - name: Unit tests, lint and APKs
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Verify release APK native libraries
        run: python3 ../scripts/verify_apk_native_libs.py app/build/outputs/apk/release/app-release.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: audiobooks-debug-apk
          path: app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
