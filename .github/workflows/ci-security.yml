name: CI — Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # New advisories appear without any commit: re-check the server dependencies weekly.
    - cron: "17 5 * * 1"

concurrency:
  group: ci-security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Pinned release binary, verified against this digest (linux x64 tarball of the official release;
      # gitleaks_8.30.1_checksums.txt of the release carries the same value). Update both together.
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

      - name: Scan the repository history and working tree
        run: |
          gitleaks version
          gitleaks git --config .gitleaks.toml --redact --no-banner --verbose .
          gitleaks dir --config .gitleaks.toml --redact --no-banner --verbose .

  govulncheck:
    name: Vulnerabilities (govulncheck)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOVULNCHECK_VERSION: v1.10.0
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Standard-library advisories are fixed in Go patch releases: scan with the newest 1.26.x, not the
      # minimum version of go.mod.
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.26"
          check-latest: true
          cache-dependency-path: server/go.sum

      - name: Install govulncheck
        run: go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"

      - name: govulncheck
        run: govulncheck ./...
