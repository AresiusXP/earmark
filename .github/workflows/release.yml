# Release pipeline: ONE version (vX.Y.Z) for the server image, the Helm chart and the Android APK.
#
#   push to main
#     -> release-please   keeps the release PR up to date; merging it creates the
#                         vX.Y.Z tag + GitHub release (and bumps Chart.yaml and
#                         .release-please-manifest.json, which Gradle reads)
#     -> tag-check        validates the tag and pins the commit every later job builds: for the manual
#                         recovery path it requires a run from main and a tag reachable from origin/main.
#                         Runs before any job that sees a secret
#     -> apk              builds and signs the release APK. This is the ONLY job with the signing secrets
#                         and it has no write token: it only uploads the artifact `apk-signed`
#                         (audiobooks-X.Y.Z.apk + .sha256, 5 days)
#     -> publish-apk      the ONLY job that can write to the release (contents: write) and it has no
#                         signing secrets: it verifies the artifact and attaches it to the GitHub release
#     -> images           builds/pushes ghcr.io/<owner>/earmark:X.Y.Z, with the APK and an update.json
#                         baked in (/update) so the server can offer in-app updates. The app asks the
#                         server instead of GitHub, so an instance can be private and release assets
#                         only matter for people who install the APK by hand. Waits for apk but never
#                         depends on its success: if the APK or the artifact is missing the image is built
#                         without it (in-app update reports "none")
#     -> chart            packages/pushes oci://ghcr.io/<owner>/charts/earmark
#     -> register         OPTIONAL GitOps step: when the ARGOCD_APPS_DEPLOY_KEY secret exists, bumps
#                         targetRevision of the earmark entry in a values file of a GitOps repository
#                         (see docs/RELEASING.md). Skips with a notice when the secret is not set
#
# Why publishing lives in this same workflow: the tag is created by release-please
# with the default GITHUB_TOKEN, and events caused by GITHUB_TOKEN do not trigger
# other workflows, so a separate `on: push: tags` / `on: release` workflow would
# never run. Images and chart therefore run here, gated on release_created.
#
# Recovery: run this workflow manually (workflow_dispatch, from main) with `tag` set to an
# existing release tag (e.g. v0.1.0) to build any MISSING image and publish the
# chart if that chart version is missing. release-please is skipped then. The apk
# job rebuilds the APK of that tag in the same run, so a recovered image gets it too.
# The tag must exist and be an ancestor of origin/main, otherwise nothing runs.
# Published versions are immutable: an image tag that already exists is never
# rebuilt (floating base-image tags could otherwise change a released version)
# unless `force_images` is explicitly ticked (do that to add the APK to an image
# that was published without it).
#
# Signing secrets of the apk job: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD; optional repository VARIABLE ANDROID_CERT_SHA256
# pins the signing certificate. See docs/RELEASING.md.
#
# ARGOCD_APPS_DEPLOY_KEY is the private half of a write deploy key registered on the GitOps
# repository only (repository variable GITOPS_REPO, default <owner>/argocd-apps). `register` only
# ever moves the deployed version FORWARD (re-running an old tag is a no-op) and skips
# pre-releases.

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)publish, e.g. v0.1.0"
        required: true
        type: string
      force_images:
        description: "Rebuild and OVERWRITE image tags that already exist (audited escape hatch)"
        required: false
        default: false
        type: boolean

# Releases are serialized; a run in progress is never cancelled halfway.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Gate for everything below. No secret is available to it. For the manual recovery path it requires that
  # the run comes from main and that the tag exists and is reachable from origin/main; a release-please tag
  # is checked the same way. The commit it resolves is what every later job checks out (a tag moved
  # between jobs is not followed).
  tag-check:
    needs: release-please
    if: ${{ !cancelled() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.verify.outputs.tag }}
      version: ${{ steps.verify.outputs.version }}
      commit: ${{ steps.verify.outputs.commit }}
    env:
      TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
    steps:
      - name: Require a run from main
        env:
          REF: ${{ github.ref }}
        run: |
          if [[ "$REF" != "refs/heads/main" ]]; then
            echo "::error::The release workflow only runs from main (got '${REF}')"
            exit 1
          fi

      - name: Check out main with its tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Verify the tag
        id: verify
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid tag '$TAG' (expected vX.Y.Z)"
            exit 1
          fi
          if ! commit="$(git rev-parse --verify --quiet "refs/tags/${TAG}^{commit}")"; then
            echo "::error::Tag ${TAG} does not exist in this repository"
            exit 1
          fi
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "::error::Tag ${TAG} (${commit}) is not reachable from origin/main; refusing to build it with release credentials"
            exit 1
          fi
          {
            echo "tag=${TAG}"
            echo "version=${TAG#v}"
            echo "commit=${commit}"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::Releasing ${TAG} at ${commit}"

  # Needs apk only to be able to download its artifact: the condition (not `success()`) keeps the
  # image, chart and deploy going when the APK build fails or is skipped.
  images:
    needs: [tag-check, apk]
    if: ${{ !cancelled() && needs.tag-check.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ needs.tag-check.outputs.tag }}
      VERSION: ${{ needs.tag-check.outputs.version }}

    steps:
      - name: Resolve image name
        id: meta
        run: |
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/earmark" >> "$GITHUB_OUTPUT"

      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag-check.outputs.commit }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip images that are already published
        id: exists
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          FORCE: ${{ inputs.force_images }}
        run: |
          if [[ "$FORCE" != "true" ]] && docker buildx imagetools inspect "${IMAGE}:${VERSION}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${IMAGE}:${VERSION} already exists; not rebuilding (tick force_images to overwrite)"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Before the build; never fails the job. An absent/invalid artifact only means no in-app update.
      - name: Download the signed APK built by the apk job
        if: steps.exists.outputs.exists != 'true'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apk-signed
          path: ${{ runner.temp }}/apk-signed

      # update.json is what the server reads (see server/internal/appupdate): the sha256/size of the
      # exact bytes in the image, versionCode as in app/app/build.gradle.kts, and the release notes
      # (best effort: a failing `gh release view` leaves them empty instead of failing the step).
      - name: Assemble the APK bundle
        if: steps.exists.outputs.exists != 'true'
        id: bundle
        env:
          APK_RESULT: ${{ needs.apk.result }}
          SIGNED_DIR: ${{ runner.temp }}/apk-signed
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          drop() {
            echo "::warning::$1; the image is built WITHOUT the in-app update bundle (apk job: ${APK_RESULT})"
            rm -f server/update/audiobooks.apk server/update/update.json
            echo "bundled=false" >> "$GITHUB_OUTPUT"
            echo "reason=$1" >> "$GITHUB_OUTPUT"
            exit 0
          }
          apk="${SIGNED_DIR}/audiobooks-${VERSION}.apk"
          grep -q '^COPY update/ /update/' server/Dockerfile || drop "server/Dockerfile of ${VERSION} does not copy update/ (tag predates the in-app update pipeline)"
          [[ -f "$apk" && -f "${apk}.sha256" ]] || drop "No signed APK artifact"
          (cd "$SIGNED_DIR" && sha256sum --check --status "audiobooks-${VERSION}.apk.sha256") || drop "audiobooks-${VERSION}.apk does not match its .sha256"
          [[ "$VERSION" =~ ^(0|[1-9][0-9]?)\.(0|[1-9][0-9]?)\.(0|[1-9][0-9]?)(-[0-9A-Za-z.-]+)?$ ]] || drop "Version ${VERSION} is outside 0..99 per component"
          IFS=. read -r major minor patch <<< "${VERSION%%-*}"
          code=$((10#$major * 10000 + 10#$minor * 100 + 10#$patch))
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body,publishedAt > "$RUNNER_TEMP/release.json"; then
            echo "::warning::Could not read release $TAG; update.json carries empty notes"
            echo '{}' > "$RUNNER_TEMP/release.json"
          fi
          mkdir -p server/update
          cp "$apk" server/update/audiobooks.apk
          jq -n \
            --arg version_name "$VERSION" \
            --argjson version_code "$code" \
            --arg sha256 "$(sha256sum "$apk" | cut -d' ' -f1)" \
            --argjson size "$(stat -c %s "$apk")" \
            --arg now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --slurpfile rel "$RUNNER_TEMP/release.json" \
            '{version_name: $version_name, version_code: $version_code, sha256: $sha256, size: $size,
              notes: (($rel[0].body // "")[0:4000]),
              released_at: (($rel[0].publishedAt // "") | if . == "" then $now else . end)}' \
            > server/update/update.json
          chmod a+r server/update/audiobooks.apk server/update/update.json
          cat server/update/update.json
          echo "::notice::Baking audiobooks-${VERSION}.apk into the image"
          {
            echo "bundled=true"
            echo "sha256=$(jq -r .sha256 server/update/update.json)"
            echo "size=$(stat -c %s server/update/audiobooks.apk)"
          } >> "$GITHUB_OUTPUT"

      # The source label links the GHCR package to this repository.
      - name: Build and push image
        id: build
        if: steps.exists.outputs.exists != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./server
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          cache-from: type=registry,ref=${{ steps.meta.outputs.image }}:cache
          cache-to: type=registry,ref=${{ steps.meta.outputs.image }}:cache,mode=max

      # Makes a silent fail-open visible: says whether the image carries the in-app update APK.
      - name: Summary
        if: ${{ always() && steps.meta.outcome == 'success' }}
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          EXISTS: ${{ steps.exists.outputs.exists }}
          BUILD: ${{ steps.build.outcome }}
          BUNDLED: ${{ steps.bundle.outputs.bundled }}
          REASON: ${{ steps.bundle.outputs.reason }}
          SHA256: ${{ steps.bundle.outputs.sha256 }}
          SIZE: ${{ steps.bundle.outputs.size }}
          APK_RESULT: ${{ needs.apk.result }}
        run: |
          {
            echo "### Image ${IMAGE}:${VERSION}"
            echo
            if [[ "$EXISTS" == "true" ]]; then
              echo "Already published, **not rebuilt**: its in-app update APK is whatever it was built with (tick force_images to rebuild)."
            elif [[ "$BUILD" != "success" ]]; then
              echo "**Image build did not succeed** (${BUILD:-not run})."
            elif [[ "$BUNDLED" == "true" ]]; then
              echo "In-app update APK: **included** - audiobooks-${VERSION}.apk, sha256 \`${SHA256:0:12}...\`, ${SIZE} bytes."
            else
              echo "In-app update APK: **NOT included** - ${REASON:-unknown reason} (apk job: ${APK_RESULT}). The app will see no update until the image is rebuilt with force_images."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Builds and signs the release APK. The only job with the signing secrets, and it holds no write
  # token and no GH_TOKEN: a compromised Gradle build or dependency cannot touch the release, the
  # tags or the packages. It hands the result to publish-apk and images as the artifact `apk-signed`.
  apk:
    needs: tag-check
    if: ${{ !cancelled() && needs.tag-check.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      TAG: ${{ needs.tag-check.outputs.tag }}
      VERSION: ${{ needs.tag-check.outputs.version }}

    steps:
      # Same rule as appupdate.VersionCode and app/app/build.gradle.kts: versionCode = X*10000+Y*100+Z
      # only stays unique and monotonic when each component is 0..99 (no leading zeros). Fails the apk
      # job before anything is built or uploaded; images still runs (without a bundle).
      - name: Check the version
        run: |
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]?)\.(0|[1-9][0-9]?)\.(0|[1-9][0-9]?)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version components must each be 0..99 without leading zeros (versionCode = X*10000+Y*100+Z); got '$VERSION'"
            exit 1
          fi

      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag-check.outputs.commit }}
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      # compileSdk 37 is newer than the platforms preinstalled on the runner image.
      - name: Install Android SDK platform and build-tools
        run: |
          SDKMANAGER="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null

      # Never writes the build cache from a job that holds signing secrets.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true

      # The keystore lives in RUNNER_TEMP only (never in the workspace), exists only for the lifetime of this
      # step (trap), and is removed again by the always() step below. Nothing here echoes a secret.
      - name: Build signed release APK
        working-directory: app
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          AUDIOBOOKS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          AUDIOBOOKS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          AUDIOBOOKS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is not set"
            exit 1
          fi
          keystore="$RUNNER_TEMP/audiobooks-release.jks"
          trap 'rm -f "$keystore"' EXIT
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$keystore"
          unset KEYSTORE_BASE64
          export AUDIOBOOKS_KEYSTORE_FILE="$keystore"
          ./gradlew :app:assembleRelease -PappVersion="$VERSION" --stacktrace

      - name: Verify signature and package
        id: pkg
        env:
          EXPECTED_CERT: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          src=app/app/build/outputs/apk/release/app-release.apk
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n1)"
          out="$("$apksigner" verify --print-certs "$src")"
          echo "$out"
          if grep -q "Android Debug" <<< "$out"; then
            echo "::error::Release APK is signed with the debug key"
            exit 1
          fi
          # Pin the signing certificate (repository VARIABLE ANDROID_CERT_SHA256, not a secret):
          # a wrong key would build an APK that installed apps refuse to update to.
          # apksigner prints `Signer #1 certificate SHA-256 digest:` (build-tools 35) or `V2 Signer: certificate
          # SHA-256 digest:` (build-tools 36 on the runners, v2-only signatures): accept both, first signer.
          cert_re='^(Signer #1 certificate|V[0-9.]+ Signer: certificate) SHA-256 digest: '
          signer="$(sed -n -E "s/${cert_re}//p" <<< "$out" | head -n1 | tr -d ':' | tr 'A-F' 'a-f')"
          expected="$(tr -d ': \t\r\n' <<< "$EXPECTED_CERT" | tr 'A-F' 'a-f')"
          if [[ -z "$expected" ]]; then
            echo "::warning::Repository variable ANDROID_CERT_SHA256 is not set; the signing certificate is not pinned (signer: ${signer})"
          elif [[ ! "$expected" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Repository variable ANDROID_CERT_SHA256 is not a SHA-256 hex digest"
            exit 1
          elif [[ "$signer" != "$expected" ]]; then
            echo "::error::APK signer certificate ${signer:-<none>} does not match ANDROID_CERT_SHA256 ${expected}"
            exit 1
          fi
          mkdir -p dist
          apk="dist/audiobooks-${VERSION}.apk"
          cp "$src" "$apk"
          (cd dist && sha256sum "audiobooks-${VERSION}.apk" > "audiobooks-${VERSION}.apk.sha256")
          {
            echo "### audiobooks-${VERSION}.apk"
            echo
            echo "SHA-256: \`$(cut -d' ' -f1 "$apk.sha256")\`"
            echo
            echo "Signer: \`${signer}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the signed APK (artifact for publish-apk and the server image)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk-signed
          path: |
            dist/audiobooks-${{ needs.tag-check.outputs.version }}.apk
            dist/audiobooks-${{ needs.tag-check.outputs.version }}.apk.sha256
          retention-days: 5
          compression-level: 0
          if-no-files-found: error

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/audiobooks-release.jks"

  # The only job that writes to the release. It never sees the signing secrets and checks out no code:
  # it only verifies the artifact of the apk job and uploads it with the GitHub CLI.
  publish-apk:
    needs: [tag-check, apk]
    if: ${{ !cancelled() && needs.apk.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ needs.tag-check.outputs.tag }}
      VERSION: ${{ needs.tag-check.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Download the signed APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apk-signed
          path: ${{ runner.temp }}/apk-signed

      - name: Verify the artifact
        working-directory: ${{ runner.temp }}/apk-signed
        run: |
          apk="audiobooks-${VERSION}.apk"
          [[ "$(find . -type f | wc -l)" == "2" && -f "$apk" && -f "${apk}.sha256" ]] || { echo "::error::Unexpected artifact content"; ls -la; exit 1; }
          [[ "$(cut -d' ' -f3- "${apk}.sha256")" == "$apk" ]] || { echo "::error::${apk}.sha256 does not name ${apk}"; exit 1; }
          sha256sum --check "${apk}.sha256"
          [[ "$(head -c2 "$apk")" == "PK" ]] || { echo "::error::${apk} is not a zip/APK file"; exit 1; }

      - name: Upload to the GitHub release
        working-directory: ${{ runner.temp }}/apk-signed
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null
          gh release upload "$TAG" "audiobooks-${VERSION}.apk" "audiobooks-${VERSION}.apk.sha256" \
            --clobber --repo "$GITHUB_REPOSITORY"
          echo "Attached audiobooks-${VERSION}.apk to ${TAG}" >> "$GITHUB_STEP_SUMMARY"

  chart:
    needs: [tag-check, images]
    if: ${{ !cancelled() && needs.images.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ needs.tag-check.outputs.tag }}
      CHART_PATH: helm/earmark
      CHART_NAME: earmark
      HELM_VERSION: v3.18.4

    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag-check.outputs.commit }}
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Verify Chart.yaml matches the release
        run: |
          version="${TAG#v}"
          chart_version="$(helm show chart "$CHART_PATH" | awk '/^version:/ {print $2}' | tr -d '"')"
          app_version="$(helm show chart "$CHART_PATH" | awk '/^appVersion:/ {print $2}' | tr -d '"')"
          if [[ "$chart_version" != "$version" || "$app_version" != "$version" ]]; then
            echo "::error::Chart.yaml (version=$chart_version, appVersion=$app_version) does not match release $version"
            exit 1
          fi
          helm lint "$CHART_PATH"

      - name: Package and push Helm chart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${TAG#v}"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          helm package "$CHART_PATH" --destination "$RUNNER_TEMP"
          echo "$GITHUB_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          # Skip the push when this chart version already exists (idempotent re-runs).
          if helm show chart "oci://ghcr.io/${owner}/charts/${CHART_NAME}" --version "$version" > /dev/null 2>&1; then
            echo "Chart ${CHART_NAME} ${version} already exists in the registry, skipping push."
            echo "Chart ${CHART_NAME} ${version} already published, push skipped." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          helm push "$RUNNER_TEMP/${CHART_NAME}-${version}.tgz" "oci://ghcr.io/${owner}/charts"
          echo "Published oci://ghcr.io/${owner}/charts/${CHART_NAME}:${version}" >> "$GITHUB_STEP_SUMMARY"

  # Optional GitOps deploy: bump the chart version a GitOps repository tracks. Does nothing (with a notice)
  # unless the ARGOCD_APPS_DEPLOY_KEY secret is set, so forks and plain `helm install` users are not affected.
  register:
    needs: [tag-check, chart]
    if: ${{ !cancelled() && needs.chart.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ needs.tag-check.outputs.tag }}
      GITOPS_REPO: ${{ vars.GITOPS_REPO || format('{0}/argocd-apps', github.repository_owner) }}
      VALUES_FILE: ${{ vars.GITOPS_VALUES_FILE || 'bootstrap/values.yaml' }}
      APP_NAME: ${{ vars.GITOPS_APP_NAME || 'earmark' }}

    steps:
      - name: Check whether GitOps registration is configured
        id: enabled
        env:
          DEPLOY_KEY: ${{ secrets.ARGOCD_APPS_DEPLOY_KEY }}
        run: |
          if [[ -z "$DEPLOY_KEY" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ARGOCD_APPS_DEPLOY_KEY is not set: skipping the optional GitOps registration (see docs/RELEASING.md)"
            echo "GitOps registration skipped: ARGOCD_APPS_DEPLOY_KEY is not set." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the GitOps repo
        if: steps.enabled.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.GITOPS_REPO }}
          ref: main
          ssh-key: ${{ secrets.ARGOCD_APPS_DEPLOY_KEY }}

      - name: Bump targetRevision
        if: steps.enabled.outputs.enabled == 'true'
        run: |
          version="${TAG#v}"
          if [[ "$version" == *-* ]]; then
            echo "::notice::Pre-release ${version} is not registered in ArgoCD"
            exit 0
          fi

          # Only the `- name: earmark` block is read/edited (no yq: it would reformat the file).
          range="/^  - name: ${APP_NAME}\$/,/^    namespace:/"
          current="$(sed -n "${range}"' s/^    targetRevision: *//p' "$VALUES_FILE")"
          if [[ ! "$current" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Cannot read the current targetRevision of ${APP_NAME} in ${VALUES_FILE} (got '${current}')"
            exit 1
          fi
          if [[ "$current" == "$version" ]]; then
            echo "::notice::${APP_NAME} is already at ${version} in ${GITOPS_REPO}"
            exit 0
          fi
          if [[ "$(printf '%s\n%s\n' "$current" "$version" | sort -V | tail -n1)" != "$version" ]]; then
            echo "::notice::${GITOPS_REPO} already has ${current}, newer than ${version}; not downgrading"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            sed -i "${range}"' s/^\(    targetRevision: \).*/\1'"${version}"'/' "$VALUES_FILE"
            if [[ "$(git diff --numstat -- "$VALUES_FILE" | cut -f1,2)" != $'1\t1' ]]; then
              echo "::error::Expected exactly one changed line in ${VALUES_FILE}"
              git diff
              exit 1
            fi
            git commit -q -a \
              -m "feat(earmark): release chart ${version}" \
              -m "Registered automatically by ${GITHUB_REPOSITORY} ${TAG}: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
            if git push origin HEAD:main; then
              echo "Registered ${APP_NAME} ${version} in ${GITOPS_REPO} (was ${current})" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}); resyncing with main"
            git reset -q --hard HEAD~1
            git fetch -q origin main
            git reset -q --hard origin/main
            current="$(sed -n "${range}"' s/^    targetRevision: *//p' "$VALUES_FILE")"
            if [[ "$(printf '%s\n%s\n' "$current" "$version" | sort -V | tail -n1)" != "$version" || "$current" == "$version" ]]; then
              echo "::notice::${GITOPS_REPO} is now at ${current}; nothing left to do"
              exit 0
            fi
          done
          echo "::error::Could not push to ${GITOPS_REPO} after 5 attempts"
          exit 1
