nameOverride: ""
fullnameOverride: ""

# The GHCR package of a private repository is private: pull with this Secret.
imagePullSecrets: []

replicaCount: 1

# ndots=1 avoids search-domain lookups for external names (Audible, Knaben, AudioBook Bay):
# with the cluster default (ndots=5) some resolvers fail to resolve them.
dnsConfig:
  options:
    - name: ndots
      value: "1"

image:
  repository: ghcr.io/aresiusxp/earmark
  # Empty = .Chart.AppVersion
  tag: ""
  pullPolicy: IfNotPresent

logLevel: info
# Empty = https://<ingress.host> (http:// when ingress.tls.enabled=false).
publicUrl: ""

# Existing Secret, not created by this chart:
#   kubectl create secret generic audiobooks-secrets -n audiobooks \
#     --from-literal=database-url='postgres://user:pass@host:5432/audiobooks?sslmode=disable' \
#     --from-literal=config-secret="$(openssl rand -base64 48)" \
#     --from-literal=instance-password='<required: protects creating install links>'
# Rotating config-secret invalidates every installed addon URL.
secrets:
  existingSecret: audiobooks-secrets
  keys:
    databaseUrl: database-url
    configSecret: config-secret
    instancePassword: instance-password

# Run without INSTANCE_PASSWORD: anyone could then create install links and make the server call
# debrid APIs with their own key. Keep false for a private instance.
allowOpenConfig: false

# Sign in with Google (an additional sign-in method for the app): the WEB OAuth client ID, used as the
# audience of the ID tokens. Public, so a plain value, not a Secret. Empty = feature off (the Google
# routes answer 404 google_disabled). More audiences: add GOOGLE_CLIENT_IDS (comma list) via extraEnv.
# audiobooks.aresius.xyz: 34828481793-g6n5cm2psogtrga580g41tmgab4h264p.apps.googleusercontent.com
googleClientId: ""

# /v1 release routes (plain values, rendered only when set; the server has defaults).
# PREPARE_ADDS_PER_HOUR: cold torrent adds per debrid key and hour for prepare/download (default 30, 1-10000).
prepareAddsPerHour: ""
# DEBRID_LINK_HOSTS: extra CDN host suffixes allowed in download redirects, "provider:suffix,provider:suffix"
# (providers torbox and realdebrid), e.g. "realdebrid:cdn.example,torbox:tb.example".
debridLinkHosts: ""
# APP_UPDATE_DIR: directory with update.json + audiobooks.apk (default /update, baked into the image).
appUpdateDir: ""
# APP_UPDATE_MAX_BYTES: largest APK the server will bundle (default 209715200 = 200 MiB); a bigger one disables updates.
appUpdateMaxBytes: ""

extraEnv: []

service:
  type: ClusterIP
  port: 8080
  adminPort: 9090

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}

ingress:
  enabled: true
  className: traefik
  host: earmark.aresius.xyz
  # Extra hostnames served by the same Ingress (and covered by the same certificate). audiobooks.aresius.xyz
  # is the old name: Stremio install URLs contain the host, so it keeps working until the addon is retired.
  extraHosts:
    - audiobooks.aresius.xyz
  annotations:
    kubernetes.io/tls-acme: "true"
    cert-manager.io/cluster-issuer: letsencrypt
    external-dns.aresius.xyz: pihole
    ingress.kubernetes.io/force-hsts: "true"
  labels:
    external-dns.aresius.xyz: pihole
  tls:
    enabled: true
    secretName: earmark.aresius.xyz-tls

# Prometheus Operator ServiceMonitor (scrapes /metrics on the admin port).
serviceMonitor:
  enabled: false
  interval: 30s
  labels:
    release: kube-prometheus-stack
