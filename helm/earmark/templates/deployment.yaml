apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "abk.fullname" . }}
  labels:
    {{- include "abk.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "abk.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "abk.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      {{- with .Values.dnsConfig }}
      dnsConfig:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: addon
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: admin
              containerPort: {{ .Values.service.adminPort }}
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            - name: ADMIN_PORT
              value: {{ .Values.service.adminPort | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            - name: PUBLIC_URL
              value: {{ include "abk.publicUrl" . | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: {{ .Values.secrets.keys.databaseUrl }}
                  optional: false
            - name: CONFIG_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: {{ .Values.secrets.keys.configSecret }}
                  optional: false
            # Required unless allowOpenConfig: protects POST /api/config (who may create install links).
            - name: ALLOW_OPEN_CONFIG
              value: {{ .Values.allowOpenConfig | quote }}
            - name: INSTANCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: {{ .Values.secrets.keys.instancePassword }}
                  optional: true
            {{- if .Values.googleClientId }}
            - name: GOOGLE_CLIENT_ID
              value: {{ .Values.googleClientId | quote }}
            {{- end }}
            {{- if .Values.prepareAddsPerHour }}
            - name: PREPARE_ADDS_PER_HOUR
              value: {{ .Values.prepareAddsPerHour | int64 | toString | quote }}
            {{- end }}
            {{- if .Values.debridLinkHosts }}
            - name: DEBRID_LINK_HOSTS
              value: {{ .Values.debridLinkHosts | quote }}
            {{- end }}
            {{- if .Values.appUpdateDir }}
            - name: APP_UPDATE_DIR
              value: {{ .Values.appUpdateDir | quote }}
            {{- end }}
            {{- if .Values.appUpdateMaxBytes }}
            - name: APP_UPDATE_MAX_BYTES
              value: {{ .Values.appUpdateMaxBytes | int64 | toString | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
