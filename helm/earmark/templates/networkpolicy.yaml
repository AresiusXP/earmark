{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "abk.fullname" . }}
  labels:
    {{- include "abk.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "abk.selectorLabels" . | nindent 6 }}
  # Ingress only: egress stays open.
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.ingressControllerNamespaceSelector | nindent 12 }}
      ports:
        - protocol: TCP
          port: http
    - from:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.metricsNamespaceSelector | nindent 12 }}
      ports:
        - protocol: TCP
          port: admin
    {{- with .Values.networkPolicy.extraIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
